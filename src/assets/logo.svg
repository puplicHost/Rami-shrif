<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%" fill="none">
  <!-- Architectural Column / عمود إغريقي مؤسسي -->
  <!-- Entablature / Capital Top -->
  <rect x="20" y="14" width="60" height="4" rx="1.5" fill="#5A342D" />
  <rect x="25" y="21" width="50" height="3" rx="1" fill="#C4C4C4" />
  
  <!-- Capital Volutes / Ionic Curvatures -->
  <path d="M22 28C22 25 25 24 28 24C32 24 34 26 34 29C34 32 32 33 29 33C25 33 24 30 25 28" stroke="#5A342D" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M78 28C78 25 75 24 72 24C68 24 66 26 66 29C66 32 68 33 71 33C75 33 76 30 75 28" stroke="#5A342D" stroke-width="2" stroke-linecap="round" fill="none"/>
  <rect x="30" y="26" width="40" height="4" rx="1" fill="#C4C4C4" />

  <!-- Column Flutes / الأعمدة الرأسية المتوازية المعمارية -->
  <line x1="33" y1="34" x2="33" y2="88" stroke="#C4C4C4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="41" y1="34" x2="41" y2="88" stroke="#C4C4C4" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="34" x2="50" y2="88" stroke="#5A342D" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="59" y1="34" x2="59" y2="88" stroke="#C4C4C4" stroke-width="2" stroke-linecap="round"/>
  <line x1="67" y1="34" x2="67" y2="88" stroke="#C4C4C4" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Subtle Letterform Silhouette in Center (ر ش) Calligraphic Precision -->
  <path d="M46 54C48 51 52 51 54 54C55 56 54 60 51 63L46 68H55" stroke="#5A342D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Base Pedestal -->
  <rect x="28" y="90" width="44" height="4" rx="1" fill="#C4C4C4" />
  <rect x="23" y="96" width="54" height="4" rx="1" fill="#5A342D" />
  <rect x="18" y="102" width="64" height="4" rx="1.5" fill="#C4C4C4" />
</svg>
